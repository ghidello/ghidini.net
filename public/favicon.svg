<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <!-- Glow behind center -->
  <circle cx="64" cy="54" r="28" fill="url(#glow)" opacity="0.5"/>
  <!-- Y-shape flux capacitor arms -->
  <line x1="64" y1="54" x2="64" y2="16" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="54" x2="31" y2="95" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="54" x2="97" y2="95" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <!-- Arm tips (energy nodes) -->
  <circle cx="64" cy="16" r="5" fill="#93c5fd"/>
  <circle cx="31" cy="95" r="5" fill="#93c5fd"/>
  <circle cx="97" cy="95" r="5" fill="#93c5fd"/>
  <!-- Center hub -->
  <circle cx="64" cy="54" r="8" fill="#2563eb"/>
  <circle cx="64" cy="54" r="5" fill="#dbeafe"/>
</svg>
