<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle — light blue -->
  <circle cx="64" cy="64" r="62" fill="url(#bg-grad)"/>
  <!-- Y-shape flux capacitor arms — glowing blue -->
  <g filter="url(#glow)">
    <line x1="64" y1="64" x2="64" y2="22" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
    <line x1="64" y1="64" x2="28" y2="85" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
    <line x1="64" y1="64" x2="100" y2="85" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
    <!-- Arm tips -->
    <circle cx="64" cy="22" r="11" fill="#3b82f6"/>
    <circle cx="28" cy="85" r="11" fill="#3b82f6"/>
    <circle cx="100" cy="85" r="11" fill="#3b82f6"/>
    <!-- Center hub -->
    <circle cx="64" cy="64" r="15" fill="#1d4ed8"/>
    <circle cx="64" cy="64" r="9" fill="#60a5fa"/>
  </g>
</svg>
